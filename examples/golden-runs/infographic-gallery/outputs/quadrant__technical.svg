<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="infographic-title infographic-desc"><title id="infographic-title">直播成为新增收入的第一引擎</title><desc id="infographic-desc">直播渠道 6 月收入 286 万元，是 1 月的 4.2 倍；新增收入贡献 46%。</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#00629B"/></marker><pattern id="tex" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#00629B" stroke-opacity="0.08" stroke-width="1"/></pattern></defs><rect x="0.0" y="0.0" width="1200.0" height="1600.0" fill="#F2F6FA" stroke="none" stroke-width="0" rx="0" /><rect x="0.0" y="0.0" width="1200.0" height="1600.0" fill="url(#tex)" stroke="none" stroke-width="0" rx="0" /><line x1="72.0" y1="44.0" x2="72.0" y2="292.0" stroke="#00629B" stroke-width="5" /><g transform="translate(86.0,56.0) scale(0.8333)" fill="none" stroke="#00629B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h6v6" />
  <path d="m22 7-8.5 8.5-5-5L2 17" /></g><text x="114.0" y="72.0" font-family="&quot;JetBrains Mono&quot;,Consolas,monospace" font-size="11.0" font-weight="700" fill="#00629B" text-anchor="start" opacity="1.0" letter-spacing="1.6">2025 客户经营复盘</text><text x="86.0" y="149.9" font-family="&quot;IBM Plex Sans&quot;,&quot;Segoe UI&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="56.0" font-weight="700" fill="#0B1F33" text-anchor="start" opacity="1.0" >直播成为新增收入的第一引擎</text><rect x="86.0" y="226.6" width="4.0" height="36.5" fill="#00629B" stroke="none" stroke-width="0" rx="0" /><text x="104.0" y="250.3" font-family="&quot;IBM Plex Sans&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="27.0" font-weight="400" fill="#0B1F33" text-anchor="start" opacity="1.0" >直播渠道 6 月收入 286 万元，是 1 月的 4.2 倍；新增收入贡献 46%。</text><text x="86.0" y="308.7" font-family="&quot;IBM Plex Sans&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="13.0" font-weight="400" fill="#5B7083" text-anchor="start" opacity="1.0" >2025 年 1–6 月｜渠道口径：确认收入</text><rect x="72.0" y="336.0" width="1056.0" height="1164.0" fill="#FFFFFF" stroke="#B8C9DA" stroke-width="1" rx="0" /><line x1="630.0" y1="356.0" x2="630.0" y2="1440.0" stroke="#B8C9DA" stroke-width="1" /><line x1="162.0" y1="898.0" x2="1098.0" y2="898.0" stroke="#B8C9DA" stroke-width="1" /><text x="174.0" y="378.0" font-family="&quot;JetBrains Mono&quot;,Consolas,monospace" font-size="11.0" font-weight="400" fill="#5B7083" text-anchor="start" opacity="1.0" >低 维度 X · 高 维度 Y</text><text x="1086.0" y="378.0" font-family="&quot;JetBrains Mono&quot;,Consolas,monospace" font-size="11.0" font-weight="400" fill="#5B7083" text-anchor="end" opacity="1.0" >高 维度 X · 高 维度 Y</text><text x="174.0" y="1428.0" font-family="&quot;JetBrains Mono&quot;,Consolas,monospace" font-size="11.0" font-weight="400" fill="#5B7083" text-anchor="start" opacity="1.0" >低 维度 X · 低 维度 Y</text><text x="1086.0" y="1428.0" font-family="&quot;JetBrains Mono&quot;,Consolas,monospace" font-size="11.0" font-weight="400" fill="#5B7083" text-anchor="end" opacity="1.0" >高 维度 X · 低 维度 Y</text><text x="630.0" y="1474.0" font-family="&quot;JetBrains Mono&quot;,Consolas,monospace" font-size="12.0" font-weight="400" fill="#5B7083" text-anchor="middle" opacity="1.0" >维度 X →</text><text x="132.0" y="898.0" font-family="&quot;JetBrains Mono&quot;,Consolas,monospace" font-size="12.0" font-weight="400" fill="#5B7083" text-anchor="middle" opacity="1.0" transform="rotate(-90 132.0 898.0)">维度 Y →</text><circle cx="929.5" cy="594.5" r="22" fill="#00629B" stroke="#FFFFFF" stroke-width="3"/><text x="902.5" y="598.5" font-family="&quot;JetBrains Mono&quot;,Consolas,monospace" font-size="12.0" font-weight="700" fill="#0B1F33" text-anchor="end" opacity="1.0" >直播增长</text><text x="902.5" y="614.5" font-family="&quot;IBM Plex Sans&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="10.0" font-weight="400" fill="#5B7083" text-anchor="end" opacity="1.0" >6 月收入 286 万元，较 1 月增长 4.2 倍。</text><circle cx="704.9" cy="984.7" r="22" fill="#00629B" stroke="#FFFFFF" stroke-width="3"/><text x="677.9" y="988.7" font-family="&quot;JetBrains Mono&quot;,Consolas,monospace" font-size="12.0" font-weight="700" fill="#0B1F33" text-anchor="end" opacity="1.0" >电商稳态</text><text x="677.9" y="1004.7" font-family="&quot;IBM Plex Sans&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="10.0" font-weight="400" fill="#5B7083" text-anchor="end" opacity="1.0" >收入 266 万元，同比 +9.8%，承担现金流基本盘。</text><circle cx="480.2" cy="767.9" r="22" fill="#00629B" stroke="#FFFFFF" stroke-width="3"/><text x="507.2" y="771.9" font-family="&quot;JetBrains Mono&quot;,Consolas,monospace" font-size="12.0" font-weight="700" fill="#0B1F33" text-anchor="start" opacity="1.0" >门店提效</text><text x="507.2" y="787.9" font-family="&quot;IBM Plex Sans&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="10.0" font-weight="400" fill="#5B7083" text-anchor="start" opacity="1.0" >收入 196 万元，环比 +2.6%，重点转向高毛利服务。</text><circle cx="405.4" cy="1071.4" r="22" fill="#00629B" stroke="#FFFFFF" stroke-width="3"/><text x="432.4" y="1075.4" font-family="&quot;JetBrains Mono&quot;,Consolas,monospace" font-size="12.0" font-weight="700" fill="#0B1F33" text-anchor="start" opacity="1.0" >私域复购</text><text x="432.4" y="1091.4" font-family="&quot;IBM Plex Sans&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="10.0" font-weight="400" fill="#5B7083" text-anchor="start" opacity="1.0" >收入 128 万元，复购率 31%，是低成本增长池。</text><circle cx="835.9" cy="1136.5" r="22" fill="#00629B" stroke="#FFFFFF" stroke-width="3"/><text x="808.9" y="1140.5" font-family="&quot;JetBrains Mono&quot;,Consolas,monospace" font-size="12.0" font-weight="700" fill="#0B1F33" text-anchor="end" opacity="1.0" >目标达成</text><text x="808.9" y="1156.5" font-family="&quot;IBM Plex Sans&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="10.0" font-weight="400" fill="#5B7083" text-anchor="end" opacity="1.0" >整体收入 876 万元，目标完成率 104%，连续 3 个月超预算。</text><circle cx="592.6" cy="551.1" r="22" fill="#00629B" stroke="#FFFFFF" stroke-width="3"/><text x="619.6" y="555.1" font-family="&quot;JetBrains Mono&quot;,Consolas,monospace" font-size="12.0" font-weight="700" fill="#0B1F33" text-anchor="start" opacity="1.0" >实验验证</text><text x="619.6" y="571.1" font-family="&quot;IBM Plex Sans&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="10.0" font-weight="400" fill="#5B7083" text-anchor="start" opacity="1.0" >B 组转化率 21.0%，较 A 组高 2.8 个百分点（95% CI 1.1–4.5）。</text><line x1="72.0" y1="1530.0" x2="1128.0" y2="1530.0" stroke="#B8C9DA" stroke-width="1" /><text x="72.0" y="1558.0" font-family="&quot;IBM Plex Sans&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.0" font-weight="400" fill="#5B7083" text-anchor="start" opacity="1.0" >数据来源：经营分析部 2025 年 6 月月报（合成演示数据）</text><text x="1128.0" y="1558.0" font-family="&quot;IBM Plex Sans&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.0" font-weight="400" fill="#5B7083" text-anchor="end" opacity="1.0" >口径：确认收入；目标=年度预算月均值；四舍五入到万元。</text></svg>