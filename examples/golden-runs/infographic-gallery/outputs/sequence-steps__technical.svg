  <circle cx="12" cy="12" r="6" />
  <circle cx="12" cy="12" r="2" /></g><text x="166.0" y="416.1" font-family="&quot;IBM Plex Sans&quot;,&quot;Segoe UI&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="21.0" font-weight="700" fill="#0B1F33" text-anchor="start" opacity="1.0" >明确问题</text><text x="166.0" y="463.0" font-family="&quot;IBM Plex Sans&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="16.0" font-weight="400" fill="#5B7083" text-anchor="start" opacity="1.0" >把业务问题写成可检验假设，并定义成功指标。</text><circle cx="100" cy="599.2" r="27" fill="#00629B"/><text x="100.0" y="607.2" font-family="&quot;JetBrains Mono&quot;,Consolas,monospace" font-size="14.0" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" >02</text><rect x="146.0" y="571.2" width="982.0" height="223.2" fill="#FFFFFF" stroke="#B8C9DA" stroke-width="1" rx="0" /><rect x="146.0" y="571.2" width="4.0" height="223.2" fill="#00629B" stroke="none" stroke-width="0" rx="0" /><g transform="translate(166.0,587.2) scale(1.4167)" fill="none" stroke="#00629B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" />
