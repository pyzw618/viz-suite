<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="infographic-title infographic-desc"><title id="infographic-title">数据底座决定增长能力的上限</title><desc id="infographic-desc">上层策略再快，也会被口径不一致与数据缺口拖慢；先补底座，再谈规模化。</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#E76F51"/></marker><pattern id="tex" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#E76F51" fill-opacity="0.09"/></pattern></defs><rect x="0.0" y="0.0" width="1200.0" height="1600.0" fill="#FFF6EE" stroke="none" stroke-width="0" rx="0" /><rect x="0.0" y="0.0" width="1200.0" height="1600.0" fill="url(#tex)" stroke="none" stroke-width="0" rx="0" /><rect x="54.0" y="28.0" width="1092.0" height="286.0" fill="#FFFFFF" stroke="#F3D6C7" stroke-width="1" rx="22" /><g transform="translate(72.0,56.0) scale(0.8333)" fill="none" stroke="#E76F51" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z" />
