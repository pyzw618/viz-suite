  <path d="m22 7-8.5 8.5-5-5L2 17" /></g><text x="302.0" y="1390.0" font-family="&quot;IBM Plex Sans&quot;,&quot;Segoe UI&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="21.0" font-weight="700" fill="#0B1F33" text-anchor="start" opacity="1.0" >成为第一引擎</text><text x="302.0" y="1436.9" font-family="&quot;IBM Plex Sans&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="16.0" font-weight="400" fill="#5B7083" text-anchor="start" opacity="1.0" >收入 286 万元，占整体 32.6%，同比增长 4.2 倍。</text><line x1="72.0" y1="1530.0" x2="1128.0" y2="1530.0" stroke="#B8C9DA" stroke-width="1" /><text x="72.0" y="1558.0" font-family="&quot;IBM Plex Sans&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.0" font-weight="400" fill="#5B7083" text-anchor="start" opacity="1.0" >数据来源：经营分析部 2025 年 6 月月报（合成演示数据）</text><text x="1128.0" y="1558.0" font-family="&quot;IBM Plex Sans&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.0" font-weight="400" fill="#5B7083" text-anchor="end" opacity="1.0" >收入为确认收入；里程碑以流程上线或模型验收为准。</text></svg>