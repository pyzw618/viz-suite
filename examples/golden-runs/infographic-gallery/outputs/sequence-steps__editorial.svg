<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="infographic-title infographic-desc"><title id="infographic-title">从问题到复制的五步闭环</title><desc id="infographic-desc">先统一口径，再做小样本实验；只有可复现的提升才进入规模化。</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#A4261D"/></marker><pattern id="tex" width="32" height="32" patternUnits="userSpaceOnUse"><line x1="0" y1="31.5" x2="32" y2="31.5" stroke="#1C1B19" stroke-opacity="0.06" stroke-width="1"/></pattern></defs><rect x="0.0" y="0.0" width="1200.0" height="1600.0" fill="#F5F0E6" stroke="none" stroke-width="0" rx="0" /><rect x="0.0" y="0.0" width="1200.0" height="1600.0" fill="url(#tex)" stroke="none" stroke-width="0" rx="0" /><line x1="72.0" y1="44.0" x2="1128.0" y2="44.0" stroke="#A4261D" stroke-width="5" /><g transform="translate(72.0,56.0) scale(0.8333)" fill="none" stroke="#A4261D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="8" x="3" y="3" rx="2" />
