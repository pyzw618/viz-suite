  <path d="M8 16H3v5" /></g><text x="168.0" y="1361.9" font-family="&quot;Source Han Serif SC&quot;,&quot;Noto Serif CJK SC&quot;,&quot;Songti SC&quot;,SimSun,serif" font-size="21.0" font-weight="700" fill="#1C1B19" text-anchor="start" opacity="1.0" >复盘迭代</text><text x="168.0" y="1408.9" font-family="&quot;Source Han Sans SC&quot;,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="16.0" font-weight="400" fill="#6B6459" text-anchor="start" opacity="1.0" >归档实验代码、数据与决策，形成组织记忆。</text><line x1="72.0" y1="1530.0" x2="1128.0" y2="1530.0" stroke="#D8CEBC" stroke-width="1" /><text x="72.0" y="1558.0" font-family="&quot;Source Han Sans SC&quot;,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="12.0" font-weight="400" fill="#6B6459" text-anchor="start" opacity="1.0" >数据来源：增长实验手册（合成演示数据）</text><text x="1128.0" y="1558.0" font-family="&quot;Source Han Sans SC&quot;,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="12.0" font-weight="400" fill="#6B6459" text-anchor="end" opacity="1.0" >每步都有交付物；未通过显著性门槛不得进入下一步。</text></svg>