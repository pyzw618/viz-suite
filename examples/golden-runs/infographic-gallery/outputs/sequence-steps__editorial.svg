  <rect width="8" height="8" x="13" y="13" rx="2" /></g><text x="100.0" y="72.0" font-family="Arial Narrow,Arial,sans-serif" font-size="12.0" font-weight="700" fill="#A4261D" text-anchor="start" opacity="1.0" letter-spacing="1.6">增长实验流程</text><text x="72.0" y="156.5" font-family="&quot;Source Han Serif SC&quot;,&quot;Noto Serif CJK SC&quot;,&quot;Songti SC&quot;,SimSun,serif" font-size="64.0" font-weight="700" fill="#1C1B19" text-anchor="start" opacity="1.0" >从问题到复制的五步闭环</text><rect x="72.0" y="242.2" width="4.0" height="40.5" fill="#A4261D" stroke="none" stroke-width="0" rx="0" /><text x="90.0" y="268.7" font-family="&quot;Source Han Sans SC&quot;,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="30.0" font-weight="400" fill="#1C1B19" text-anchor="start" opacity="1.0" >先统一口径，再做小样本实验；只有可复现的提升才进入规模化。</text><text x="72.0" y="331.2" font-family="&quot;Source Han Sans SC&quot;,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="14.0" font-weight="400" fill="#6B6459" text-anchor="start" opacity="1.0" >单次实验周期 4–6 周</text><line x1="100.0" y1="385.2" x2="100.0" y2="1482.0" stroke="#D8CEBC" stroke-width="2" /><circle cx="100" cy="379.15999999999997" r="27" fill="#A4261D"/><text x="100.0" y="387.2" font-family="Arial Narrow,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" >01</text><rect x="146.0" y="351.2" width="982.0" height="220.2" fill="#FFFDF8" stroke="#D8CEBC" stroke-width="1" rx="0" /><rect x="146.0" y="351.2" width="982.0" height="4.0" fill="#A4261D" stroke="none" stroke-width="0" rx="0" /><g transform="translate(168.0,369.2) scale(1.4167)" fill="none" stroke="#A4261D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <circle cx="12" cy="12" r="6" />
  <circle cx="12" cy="12" r="2" /></g><text x="168.0" y="433.2" font-family="&quot;Source Han Serif SC&quot;,&quot;Noto Serif CJK SC&quot;,&quot;Songti SC&quot;,SimSun,serif" font-size="21.0" font-weight="700" fill="#1C1B19" text-anchor="start" opacity="1.0" >明确问题</text><text x="168.0" y="480.2" font-family="&quot;Source Han Sans SC&quot;,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="16.0" font-weight="400" fill="#6B6459" text-anchor="start" opacity="1.0" >把业务问题写成可检验假设，并定义成功指标。</text><circle cx="100" cy="611.328" r="27" fill="#A4261D"/><text x="100.0" y="619.3" font-family="Arial Narrow,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" >02</text><rect x="146.0" y="583.3" width="982.0" height="220.2" fill="#FFFDF8" stroke="#D8CEBC" stroke-width="1" rx="0" /><rect x="146.0" y="583.3" width="982.0" height="4.0" fill="#A4261D" stroke="none" stroke-width="0" rx="0" /><g transform="translate(168.0,601.3) scale(1.4167)" fill="none" stroke="#A4261D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" />
