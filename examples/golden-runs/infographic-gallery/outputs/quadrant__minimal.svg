<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="infographic-title infographic-desc"><title id="infographic-title">直播成为新增收入的第一引擎</title><desc id="infographic-desc">直播渠道 6 月收入 286 万元，是 1 月的 4.2 倍；新增收入贡献 46%。</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#0F62FE"/></marker></defs><rect x="0.0" y="0.0" width="1200.0" height="1600.0" fill="#FFFFFF" stroke="none" stroke-width="0" rx="0" /><line x1="72.0" y1="44.0" x2="1128.0" y2="44.0" stroke="#0F62FE" stroke-width="5" /><g transform="translate(72.0,56.0) scale(0.8333)" fill="none" stroke="#0F62FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h6v6" />
  <path d="m22 7-8.5 8.5-5-5L2 17" /></g><text x="100.0" y="72.0" font-family="Inter,Arial,sans-serif" font-size="12.0" font-weight="700" fill="#0F62FE" text-anchor="start" opacity="1.0" letter-spacing="1.6">2025 客户经营复盘</text><text x="72.0" y="153.2" font-family="Inter,&quot;Helvetica Neue&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="60.0" font-weight="700" fill="#111827" text-anchor="start" opacity="1.0" >直播成为新增收入的第一引擎</text><rect x="72.0" y="234.4" width="4.0" height="37.8" fill="#0F62FE" stroke="none" stroke-width="0" rx="0" /><text x="90.0" y="259.0" font-family="Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="28.0" font-weight="400" fill="#111827" text-anchor="start" opacity="1.0" >直播渠道 6 月收入 286 万元，是 1 月的 4.2 倍；新增收入贡献 46%。</text><text x="72.0" y="318.8" font-family="Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="15.0" font-weight="400" fill="#6B7280" text-anchor="start" opacity="1.0" >2025 年 1–6 月｜渠道口径：确认收入</text><rect x="72.0" y="338.8" width="1056.0" height="1161.2" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="3" /><line x1="630.0" y1="358.8" x2="630.0" y2="1440.0" stroke="#E5E7EB" stroke-width="1" /><line x1="162.0" y1="899.4" x2="1098.0" y2="899.4" stroke="#E5E7EB" stroke-width="1" /><text x="174.0" y="380.8" font-family="Inter,Arial,sans-serif" font-size="11.0" font-weight="400" fill="#6B7280" text-anchor="start" opacity="1.0" >低 维度 X · 高 维度 Y</text><text x="1086.0" y="380.8" font-family="Inter,Arial,sans-serif" font-size="11.0" font-weight="400" fill="#6B7280" text-anchor="end" opacity="1.0" >高 维度 X · 高 维度 Y</text><text x="174.0" y="1428.0" font-family="Inter,Arial,sans-serif" font-size="11.0" font-weight="400" fill="#6B7280" text-anchor="start" opacity="1.0" >低 维度 X · 低 维度 Y</text><text x="1086.0" y="1428.0" font-family="Inter,Arial,sans-serif" font-size="11.0" font-weight="400" fill="#6B7280" text-anchor="end" opacity="1.0" >高 维度 X · 低 维度 Y</text><text x="630.0" y="1474.0" font-family="Inter,Arial,sans-serif" font-size="12.0" font-weight="400" fill="#6B7280" text-anchor="middle" opacity="1.0" >维度 X →</text><text x="132.0" y="899.4" font-family="Inter,Arial,sans-serif" font-size="12.0" font-weight="400" fill="#6B7280" text-anchor="middle" opacity="1.0" transform="rotate(-90 132.0 899.4)">维度 Y →</text><circle cx="929.5" cy="596.7" r="22" fill="#0F62FE" stroke="#FFFFFF" stroke-width="3"/><text x="902.5" y="600.7" font-family="Inter,Arial,sans-serif" font-size="12.0" font-weight="700" fill="#111827" text-anchor="end" opacity="1.0" >直播增长</text><text x="902.5" y="616.7" font-family="Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="10.0" font-weight="400" fill="#6B7280" text-anchor="end" opacity="1.0" >6 月收入 286 万元，较 1 月增长 4.2 倍。</text><circle cx="704.9" cy="985.9" r="22" fill="#0F62FE" stroke="#FFFFFF" stroke-width="3"/><text x="677.9" y="989.9" font-family="Inter,Arial,sans-serif" font-size="12.0" font-weight="700" fill="#111827" text-anchor="end" opacity="1.0" >电商稳态</text><text x="677.9" y="1005.9" font-family="Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="10.0" font-weight="400" fill="#6B7280" text-anchor="end" opacity="1.0" >收入 266 万元，同比 +9.8%，承担现金流基本盘。</text><circle cx="480.2" cy="769.7" r="22" fill="#0F62FE" stroke="#FFFFFF" stroke-width="3"/><text x="507.2" y="773.7" font-family="Inter,Arial,sans-serif" font-size="12.0" font-weight="700" fill="#111827" text-anchor="start" opacity="1.0" >门店提效</text><text x="507.2" y="789.7" font-family="Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="10.0" font-weight="400" fill="#6B7280" text-anchor="start" opacity="1.0" >收入 196 万元，环比 +2.6%，重点转向高毛利服务。</text><circle cx="405.4" cy="1072.4" r="22" fill="#0F62FE" stroke="#FFFFFF" stroke-width="3"/><text x="432.4" y="1076.4" font-family="Inter,Arial,sans-serif" font-size="12.0" font-weight="700" fill="#111827" text-anchor="start" opacity="1.0" >私域复购</text><text x="432.4" y="1092.4" font-family="Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="10.0" font-weight="400" fill="#6B7280" text-anchor="start" opacity="1.0" >收入 128 万元，复购率 31%，是低成本增长池。</text><circle cx="835.9" cy="1137.3" r="22" fill="#0F62FE" stroke="#FFFFFF" stroke-width="3"/><text x="808.9" y="1141.3" font-family="Inter,Arial,sans-serif" font-size="12.0" font-weight="700" fill="#111827" text-anchor="end" opacity="1.0" >目标达成</text><text x="808.9" y="1157.3" font-family="Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="10.0" font-weight="400" fill="#6B7280" text-anchor="end" opacity="1.0" >整体收入 876 万元，目标完成率 104%，连续 3 个月超预算。</text><circle cx="592.6" cy="553.4" r="22" fill="#0F62FE" stroke="#FFFFFF" stroke-width="3"/><text x="619.6" y="557.4" font-family="Inter,Arial,sans-serif" font-size="12.0" font-weight="700" fill="#111827" text-anchor="start" opacity="1.0" >实验验证</text><text x="619.6" y="573.4" font-family="Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="10.0" font-weight="400" fill="#6B7280" text-anchor="start" opacity="1.0" >B 组转化率 21.0%，较 A 组高 2.8 个百分点（95% CI 1.1–4.5）。</text><line x1="72.0" y1="1530.0" x2="1128.0" y2="1530.0" stroke="#E5E7EB" stroke-width="1" /><text x="72.0" y="1558.0" font-family="Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="12.0" font-weight="400" fill="#6B7280" text-anchor="start" opacity="1.0" >数据来源：经营分析部 2025 年 6 月月报（合成演示数据）</text><text x="1128.0" y="1558.0" font-family="Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="12.0" font-weight="400" fill="#6B7280" text-anchor="end" opacity="1.0" >口径：确认收入；目标=年度预算月均值；四舍五入到万元。</text></svg>