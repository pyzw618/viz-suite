ang SC&quot;,sans-serif" font-size="13.0" font-weight="400" fill="#6B6459" text-anchor="start" opacity="1.0" >跨团队实验评审与复盘机制</text><text x="791.6" y="508.1" font-family="&quot;Source Han Serif SC&quot;,&quot;Noto Serif CJK SC&quot;,&quot;Songti SC&quot;,SimSun,serif" font-size="25.1" font-weight="700" fill="#1C1B19" text-anchor="end" opacity="1.0" >P5</text><polygon points="374.4,614.528 825.6,614.528 901.2,831.3960000000001 298.8,831.3960000000001" fill="#F3E0DA" stroke="#D8CEBC" stroke-width="1"/><text x="336.8" y="638.5" font-family="Arial Narrow,Arial,sans-serif" font-size="11.0" font-weight="700" fill="#A4261D" text-anchor="start" opacity="1.0" >L2</text><text x="336.8" y="662.5" font-family="&quot;Source Han Serif SC&quot;,&quot;Noto Serif CJK SC&quot;,&quot;Songti SC&quot;,SimSun,serif" font-size="22.0" font-weight="700" fill="#1C1B19" text-anchor="start" opacity="1.0" >渠道策略</text><text x="336.8" y="701.5" font-family="&quot;Source Han Sans SC&quot;,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="13.0" font-weight="400" fill="#6B6459" text-anchor="start" opacity="1.0" >按边际 ROI 分配预算与触点</text><text x="867.2" y="731.0" font-family="&quot;Source Han Serif SC&quot;,&quot;Noto Serif CJK SC&quot;,&quot;Songti SC&quot;,SimSun,serif" font-size="25.1" font-weight="700" fill="#1C1B19" text-anchor="end" opacity="1.0" >P4</text><polygon points="298.8,837.396 901.2,837.396 976.8,1054.264 223.2,1054.264" fill="#F5E5E0" stroke="#D8CEBC" stroke-width="1"/><text x="261.2" y="861.4" font-family="Arial Narrow,Arial,sans-serif" font-size="11.0" font-weight="700" fill="#A4261D" text-anchor="start" opacity="1.0" >L3</text><text x="261.2" y="885.4" font-family="&quot;Source Han Serif SC&quot;,&quot;Noto Serif CJK SC&quot;,&quot;Songti SC&quot;,SimSun,serif" font-size="22.0" font-weight="700" fill="#1C1B19" text-anchor="start" opacity="1.0" >实验方法</text><text x="261.2" y="924.4" font-family="&quot;Source Han Sans SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Ping