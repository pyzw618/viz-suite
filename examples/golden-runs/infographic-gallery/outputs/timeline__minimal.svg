<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="infographic-title infographic-desc"><title id="infographic-title">直播渠道在 4 月完成从试点到主引擎的跃迁</title><desc id="infographic-desc">1 月试点、3 月跑通投放模型、4 月进入主推、6 月贡献 32.6% 收入。</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#0F62FE"/></marker></defs><rect x="0.0" y="0.0" width="1200.0" height="1600.0" fill="#FFFFFF" stroke="none" stroke-width="0" rx="0" /><line x1="72.0" y1="44.0" x2="1128.0" y2="44.0" stroke="#0F62FE" stroke-width="5" /><g transform="translate(72.0,56.0) scale(0.8333)" fill="none" stroke="#0F62FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3" />
