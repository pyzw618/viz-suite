<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="infographic-title infographic-desc"><title id="infographic-title">从问题到复制的五步闭环</title><desc id="infographic-desc">先统一口径，再做小样本实验；只有可复现的提升才进入规模化。</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#0F62FE"/></marker></defs><rect x="0.0" y="0.0" width="1200.0" height="1600.0" fill="#FFFFFF" stroke="none" stroke-width="0" rx="0" /><line x1="72.0" y1="44.0" x2="1128.0" y2="44.0" stroke="#0F62FE" stroke-width="5" /><g transform="translate(72.0,56.0) scale(0.8333)" fill="none" stroke="#0F62FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="8" x="3" y="3" rx="2" />
  <path d="M7 11v4a2 2 0 0 0 2 2h4" />
  <rect width="8" height="8" x="13" y="13" rx="2" /></g><text x="100.0" y="72.0" font-family="Inter,Arial,sans-serif" font-size="12.0" font-weight="700" fill="#0F62FE" text-anchor="start" opacity="1.0" letter-spacing="1.6">增长实验流程</text><text x="72.0" y="153.2" font-family="Inter,&quot;Helvetica Neue&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="60.0" font-weight="700" fill="#111827" text-anchor="start" opacity="1.0" >从问题到复制的五步闭环</text><rect x="72.0" y="234.4" width="4.0" height="37.8" fill="#0F62FE" stroke="none" stroke-width="0" rx="0" /><text x="90.0" y="259.0" font-family="Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="28.0" font-weight="400" fill="#111827" text-anchor="start" opacity="1.0" >先统一口径，再做小样本实验；只有可复现的提升才进入规模化。</text><text x="72.0" y="318.8" font-family="Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="15.0" font-weight="400" fill="#6B7280" text-anchor="start" opacity="1.0" >单次实验周期 4–6 周</text><line x1="100.0" y1="372.8" x2="100.0" y2="1482.0" stroke="#E5E7EB" stroke-width="2" /><circle cx="100" cy="366.8" r="27" fill="#0F62FE"/><text x="100.0" y="374.8" font-family="Inter,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" >01</text><rect x="146.0" y="338.8" width="982.0" height="222.6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="3" /><g transform="translate(172.0,360.8) scale(1.4167)" fill="none" stroke="#0F62FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <circle cx="12" cy="12" r="6" />
  <circle cx="12" cy="12" r="2" /></g><text x="172.0" y="424.9" font-family="Inter,&quot;Helvetica Neue&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="21.0" font-weight="700" fill="#111827" text-anchor="start" opacity="1.0" >明确问题</text><text x="172.0" y="471.8" font-family="Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="16.0" font-weight="400" fill="#6B7280" text-anchor="start" opacity="1.0" >把业务问题写成可检验假设，并定义成功指标。</text><circle cx="100" cy="601.44" r="27" fill="#0F62FE"/><text x="100.0" y="609.4" font-family="Inter,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" >02</text><rect x="146.0" y="573.4" width="982.0" height="222.6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="3" /><g transform="translate(172.0,595.4) scale(1.4167)" fill="none" stroke="#0F62FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" />
