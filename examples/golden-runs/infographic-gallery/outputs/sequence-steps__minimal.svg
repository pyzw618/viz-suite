  <path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z" />
  <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05" /></g><text x="172.0" y="1128.8" font-family="Inter,&quot;Helvetica Neue&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="21.0" font-weight="700" fill="#111827" text-anchor="start" opacity="1.0" >规模复制</text><text x="172.0" y="1175.8" font-family="Inter,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif" font-size="16.0" font-weight="400" fill="#6B7280" text-anchor="start" opacity="1.0" >在更多渠道复现，检查效应是否稳定。</text><circle cx="100" cy="1305.3600000000001" r="27" fill="#0F62FE"/><text x="100.0" y="1313.4" font-family="Inter,Arial,sans-serif" font-size="14.0" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0" >05</text><rect x="146.0" y="1277.4" width="982.0" height="222.6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="3" /><g transform="translate(172.0,1299.4) scale(1.4167)" fill="none" stroke="#0F62FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
  <path d="M21 3v5h-5" />
