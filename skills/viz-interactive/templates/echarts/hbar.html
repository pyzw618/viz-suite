<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长标签渠道满意度横向条形微看板 · ECharts</title>
<style>
:root{
  --viz-bg:#FFFFFF;
  --viz-surface:#F8FAFC;
  --viz-text:#1F2937;
  --viz-muted:#6B7280;
  --viz-grid:#E2E8F0;
  --viz-focal:#0072B2;
  --viz-context:#94A3B8;
  --viz-positive:#198038;
  --viz-negative:#DA1E28;
  --viz-alert:#D97706;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--viz-bg);color:var(--viz-text);font-family:"Inter","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif}
body{padding:20px 24px 16px;overflow-x:hidden}
header h1{font-size:20px;margin:0 0 4px;font-weight:700}
header p{margin:0 0 14px;color:var(--viz-muted);font-size:13px}

/* KPI Summary Strip */
.stat-strip{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:16px;
}
.stat-card{
  background:var(--viz-surface);
  border:1px solid var(--viz-grid);
  border-radius:6px;
  padding:10px 14px;
}
.stat-label{font-size:11px;color:var(--viz-muted);text-transform:uppercase;letter-spacing:0.5px}
.stat-value{font-size:20px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.stat-sub{font-size:11px;color:var(--viz-muted);display:flex;align-items:center;gap:4px}
.stat-sub.positive{color:var(--viz-positive);font-weight:600}
.stat-sub.negative{color:var(--viz-negative);font-weight:600}
.stat-sub.highlight{color:var(--viz-focal);font-weight:600}

#chart{width:100%;height:calc(100vh - 220px);min-height:440px}
figcaption{font-size:12px;color:var(--viz-muted);margin-top:10px}

@media (max-width:768px){
  body{padding:12px}
  .stat-strip{grid-template-columns:repeat(2,1fr);gap:8px}
  header h1{font-size:17px}
  #chart{height:calc(100vh - 240px);min-height:400px}
}
@media (prefers-color-scheme: dark){
  :root{
    --viz-bg:#0B1220;
    --viz-surface:#1E293B;
    --viz-text:#E5E7EB;
    --viz-muted:#9CA3AF;
    --viz-grid:#334155;
    --viz-focal:#38BDF8;
    --viz-context:#64748B;
  }
}
</style>
</head>
<body>
<header>
  <h1>企微专属与线下体验满意度居前，社媒渠道待深度优化</h1>
  <p>满分 5.0 分｜长标签自适应折行｜端头标注「得分 (较均值 Δ)」双编码｜全渠道基准线｜演示用合成数据</p>
</header>

<div class="stat-strip">
  <div class="stat-card">
    <div class="stat-label">标杆渠道最高分</div>
    <div class="stat-value" id="val-champ">--</div>
    <div class="stat-sub positive" id="val-champ-sub">--</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">全渠道综合均值</div>
    <div class="stat-value" id="val-avg">--</div>
    <div class="stat-sub" id="val-avg-sub">达标及格线 3.50 分</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">领先渠道占比</div>
    <div class="stat-value" id="val-lead">--</div>
    <div class="stat-sub highlight" id="val-lead-sub">高于全域均值</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">最小与最大极差</div>
    <div class="stat-value" id="val-range">--</div>
    <div class="stat-sub negative" id="val-range-sub">服务体验方差显著</div>
  </div>
</div>

<figure>
  <div id="chart" role="img" aria-label="六个客服渠道满意度横向条形微看板，企业微信专属客户经理评分最高"></div>
  <figcaption>数据来源：客户服务体验度量问卷（演示数据合成）｜ECharts 5｜微看板卡片自包含</figcaption>
</figure>

<script src="../../assets/vendor/echarts.min.js"></script>
<script>
const css = getComputedStyle(document.documentElement);
const C = k => css.getPropertyValue(k).trim();
const ROLE = {
  text: C('--viz-text'), muted: C('--viz-muted'), grid: C('--viz-grid'),
  focal: C('--viz-focal'), context: C('--viz-context'),
  positive: C('--viz-positive'), negative: C('--viz-negative'), alert: C('--viz-alert')
};
const categories = [
  '企业微信专属客户经理一对一',
  '线下门店导购与体验顾问接待',
  '400 电话热线与语音机器人转人工',
  '电商平台旗舰店在线客服（含直播）',
  '微信小程序自助服务与公众号留言',
  '第三方社交平台舆情与私信反馈'
];
const values = [4.18, 3.92, 3.48, 3.35, 3.12, 2.95];

// 动态统计指标
const avgVal = values.reduce((a, b) => a + b, 0) / values.length;
const maxVal = Math.max(...values);
const minVal = Math.min(...values);
const diffRange = (maxVal - minVal).toFixed(2);
const champIdx = values.indexOf(maxVal);
const leadCount = values.filter(v => v >= avgVal).length;

document.getElementById('val-champ').textContent = maxVal.toFixed(2) + ' 分';
document.getElementById('val-champ-sub').textContent = '★ ' + categories[champIdx].slice(0, 4) + ' 领跑全域';
document.getElementById('val-avg').textContent = avgVal.toFixed(2) + ' 分';
document.getElementById('val-lead').textContent = leadCount + ' / ' + values.length + ' 渠道';
document.getElementById('val-range').textContent = 'Δ ' + diffRange + ' 分';

const chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});

function buildOption(width) {
  const mobile = width < 600;
  return {
    backgroundColor: 'transparent',
    aria: {enabled: true, decal: {show: false}, label: {description: '企业微信和线下门店满意度居前，社媒最低。'}},
    tooltip: {
      trigger: 'axis',
      axisPointer: {type: 'shadow'},
      formatter: params => {
        const p = params[0];
        const val = p.value;
        const delta = (val - avgVal).toFixed(2);
        const sign = delta >= 0 ? '+' : '';
        return '<strong>' + p.name + '</strong><br/>' +
               '满意度评分：' + val.toFixed(2) + ' 分<br/>' +
               '相对全渠道均值：' + sign + delta + ' 分';
      }
    },
    grid: {
      left: mobile ? 128 : 220,
      right: mobile ? 80 : 110,
      top: mobile ? 20 : 24,
      bottom: mobile ? 24 : 32
    },
    xAxis: {
      type: 'value',
      min: 0,
      max: 5,
      splitLine: {lineStyle: {color: ROLE.grid, type: 'dashed', opacity: 0.55}},
      axisLabel: {color: ROLE.muted, fontSize: mobile ? 10 : 12}
    },
    yAxis: {
      type: 'category',
      data: categories,
      inverse: true,
      axisTick: {show: false},
      axisLine: {lineStyle: {color: ROLE.grid}},
      axisLabel: {
        color: ROLE.text,
        fontSize: mobile ? 10 : 12,
        width: mobile ? 116 : 206,
        overflow: 'break'
      }
    },
    series: [{
      type: 'bar',
      data: values.map((v, i) => ({
        value: v,
        itemStyle: {
          color: i === 0 ? ROLE.focal : (v >= avgVal ? 'rgba(0,114,178,0.80)' : ROLE.context),
          borderRadius: [0, 3, 3, 0]
        }
      })),
      barWidth: mobile ? 18 : 22,
      markLine: {
        symbol: ['none', 'none'],
        data: [
          {
            xAxis: Number(avgVal.toFixed(2)),
            lineStyle: {color: ROLE.alert, type: 'dashed', width: 1.5},
            label: {
              formatter: '均值 ' + avgVal.toFixed(2),
              position: 'insideEndTop',
              color: ROLE.alert,
              fontSize: 10
            }
          }
        ]
      },
      label: {
        show: true,
        position: 'right',
        color: ROLE.text,
        fontSize: mobile ? 10 : 11,
        formatter: p => {
          const d = (p.value - avgVal).toFixed(2);
          const sign = d >= 0 ? '+' : '';
          return p.value.toFixed(2) + ' (' + sign + d + ')';
        }
      }
    }]
  };
}

function render() {
  chart.resize();
  chart.setOption(buildOption(window.innerWidth), true);
}
render();
let timer = null;
window.addEventListener('resize', () => {
  clearTimeout(timer);
  timer = setTimeout(render, 120);
});
</script>
</body>
</html>
