<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>矩形树图 · D3 v7</title>
<style>
:root{--viz-bg:#FFFFFF;--viz-text:#1F2937;--viz-muted:#6B7280;--viz-grid:#E2E8F0;--viz-focal:#0072B2;--viz-context:#CBD5E1;--viz-positive:#198038;--viz-negative:#DA1E28;--viz-alert:#D97706}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--viz-bg);color:var(--viz-text);font-family:"Inter","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif}
body{padding:20px 24px 12px;overflow-x:hidden}header h1{font-size:20px;margin:0 0 4px;font-weight:700}header p{margin:0 0 10px;color:var(--viz-muted);font-size:13px}
#chart{width:100%;height:calc(100vh - 165px);min-height:440px}
svg{display:block;width:100%;height:100%}
figcaption{font-size:12px;color:var(--viz-muted);margin-top:8px}
@media (max-width:600px){body{padding:12px}header h1{font-size:17px}header p{font-size:12px}#chart{height:calc(100vh - 145px)}}
@media (prefers-color-scheme: dark){:root{--viz-bg:#0B1220;--viz-text:#E5E7EB;--viz-muted:#9CA3AF;--viz-grid:#334155}}
</style>
</head>
<body>
<header><h1>产品成本结构中原材料占比最高，物流次之</h1><p>面积=成本金额（万元）｜颜色=一级科目｜演示用合成数据</p></header>
<figure>
  <div id="chart" role="img" aria-label="产品成本矩形树图，原材料 420 万最高，物流 210 万次之"></div>
  <figcaption>数据来源：演示数据（合成）｜D3 v7｜离线自包含</figcaption>
</figure>
<script src="../../assets/vendor/d3.min.js"></script>
<script>
const css = getComputedStyle(document.documentElement);
const C = k => css.getPropertyValue(k).trim();
const ROLE = {text:C('--viz-text'),muted:C('--viz-muted'),grid:C('--viz-grid')};
const data = {
  name: '总成本', children: [
    {name: '原材料', children: [
      {name: '芯片', value: 180}, {name: '结构件', value: 120}, {name: '包装', value: 70}, {name: '其他物料', value: 50}
    ]},
    {name: '物流', children: [
      {name: '干线运输', value: 95}, {name: '仓储', value: 65}, {name: '末端配送', value: 50}
    ]},
    {name: '人力', children: [
      {name: '生产', value: 90}, {name: '客服', value: 50}, {name: '管理', value: 40}
    ]},
    {name: '渠道费用', children: [
      {name: '平台佣金', value: 80}, {name: '推广', value: 70}
    ]}
  ]
};
const COLORS = ['#0072B2', '#E69F00', '#CC79A7', '#009E73'];
const color = d3.scaleOrdinal().domain(data.children.map(d => d.name)).range(COLORS);

function draw() {
  const host = document.getElementById('chart');
  const width = host.clientWidth;
  const height = host.clientHeight;
  const mobile = width < 600;
  d3.select(host).selectAll('*').remove();
  const svg = d3.select(host).append('svg')
    .attr('viewBox', `0 0 ${width} ${height}`).attr('width', width).attr('height', height);

  const root = d3.hierarchy(data).sum(d => d.value || 0).sort((a, b) => b.value - a.value);
  d3.treemap().size([width, height]).paddingOuter(4).paddingInner(2)
    .paddingTop(d => d.depth === 1 ? (mobile ? 16 : 20) : 0)(root);

  const branches = svg.selectAll('g.branch').data(root.children).join('g').attr('class', 'branch');
  branches.append('rect')
    .attr('x', d => d.x0).attr('y', d => d.y0)
    .attr('width', d => Math.max(0, d.x1 - d.x0)).attr('height', d => Math.max(0, d.y1 - d.y0))
    .attr('fill', d => color(d.data.name)).attr('fill-opacity', 0.94)
    .attr('stroke', '#fff').attr('stroke-width', 2)
    .append('title').text(d => `${d.data.name}：${d.value} 万元`);

  branches.append('text')
    .attr('x', d => d.x0 + 6).attr('y', d => d.y0 + (mobile ? 12 : 15))
    .text(d => `${d.data.name} ${d.value}`)
    .attr('font-size', mobile ? 10 : 12).attr('font-weight', 600).attr('fill', '#fff')
    .attr('pointer-events', 'none');

  const leaves = svg.selectAll('g.leaf')
    .data(root.leaves().filter(d => (d.x1 - d.x0) > 26 && (d.y1 - d.y0) > 18)).join('g');
  leaves.append('rect')
    .attr('x', d => d.x0).attr('y', d => d.y0)
    .attr('width', d => d.x1 - d.x0).attr('height', d => d.y1 - d.y0)
    .attr('fill', d => color(d.parent.data.name)).attr('fill-opacity', 0.30)
    .attr('stroke', '#fff').attr('stroke-width', 1)
    .append('title').text(d => `${d.parent.data.name} / ${d.data.name}：${d.value} 万元`);
  leaves.append('text')
    .attr('x', d => (d.x0 + d.x1) / 2).attr('y', d => (d.y0 + d.y1) / 2)
    .attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
    .attr('font-size', mobile ? 9 : 10).attr('fill', ROLE.text)
    .attr('pointer-events', 'none')
    .text(d => (d.x1 - d.x0) > (mobile ? 55 : 70) ? `${d.data.name} ${d.value}` : d.data.name);

  svg.append('text').attr('x', 4).attr('y', height - 4).attr('font-size', mobile ? 9 : 10)
    .attr('fill', ROLE.muted).text('面积 = 成本金额；悬停查看明细');
}
draw();
let timer = null;
window.addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(draw, 160); });
</script>
</body>
</html>
