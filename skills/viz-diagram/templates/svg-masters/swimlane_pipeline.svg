<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" style="background:#FFFFFF;font-family:Inter,system-ui,sans-serif;">
  <defs>
    <filter id="sl-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <marker id="sl-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="sl-reject" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Header -->
  <g id="slot-header" transform="translate(60, 42)">
    <rect x="0" y="0" width="4" height="38" fill="#0284C7" rx="2"/>
    <text x="16" y="22" fill="#0F172A" font-size="22" font-weight="700">跨部门敏捷研发交付闭环泳道 (Cross-Functional Delivery Swimlane)</text>
    <text x="16" y="38" fill="#64748B" font-size="12">产品需求洞察 → 方案架构评审 → 自动化持续集成 → 生产金丝雀灰度与复盘闭环</text>
  </g>

  <!-- Swimlane Grid Background -->
  <g transform="translate(60, 100)">
    <!-- Stage Columns Headers -->
    <rect x="180" y="0" width="260" height="36" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="310" y="23" fill="#334155" font-size="13" font-weight="700" text-anchor="middle">阶段一：需求与立项</text>
    <rect x="440" y="0" width="280" height="36" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="580" y="23" fill="#334155" font-size="13" font-weight="700" text-anchor="middle">阶段二：方案与研发</text>
    <rect x="720" y="0" width="280" height="36" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="860" y="23" fill="#334155" font-size="13" font-weight="700" text-anchor="middle">阶段三：测试与准入</text>
    <rect x="1000" y="0" width="280" height="36" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="1140" y="23" fill="#334155" font-size="13" font-weight="700" text-anchor="middle">阶段四：发布与复盘</text>

    <!-- Lane 1: Product / Design -->
    <rect x="0" y="36" width="180" height="170" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2"/>
    <text x="90" y="112" fill="#0369A1" font-size="14" font-weight="700" text-anchor="middle">产品与体验 (PM/UX)</text>
    <text x="90" y="132" fill="#64748B" font-size="11" text-anchor="middle">价值定义与交互验收</text>
    <rect x="180" y="36" width="1100" height="170" fill="#FFFFFF" stroke="#E2E8F0"/>

    <!-- Lane 2: Engineering / Architecture -->
    <rect x="0" y="206" width="180" height="170" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="90" y="282" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">架构与研发 (Dev)</text>
    <text x="90" y="302" fill="#64748B" font-size="11" text-anchor="middle">系统设计与编码构建</text>
    <rect x="180" y="206" width="1100" height="170" fill="#FBFDFF" stroke="#E2E8F0"/>

    <!-- Lane 3: Quality / Security Assurance -->
    <rect x="0" y="376" width="180" height="170" fill="#FEFCE8" stroke="#FEF08A" stroke-width="1.2"/>
    <text x="90" y="452" fill="#A16207" font-size="14" font-weight="700" text-anchor="middle">质控与安全 (QA/Sec)</text>
    <text x="90" y="472" fill="#64748B" font-size="11" text-anchor="middle">自动化巡检与安全红蓝</text>
    <rect x="180" y="376" width="1100" height="170" fill="#FFFFFF" stroke="#E2E8F0"/>

    <!-- Lane 4: SRE / Business Operations -->
    <rect x="0" y="546" width="180" height="170" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2"/>
    <text x="90" y="622" fill="#15803D" font-size="14" font-weight="700" text-anchor="middle">运维与运营 (SRE/Ops)</text>
    <text x="90" y="642" fill="#64748B" font-size="11" text-anchor="middle">灰度部署与业务指标复盘</text>
    <rect x="180" y="546" width="1100" height="170" fill="#FAFCFB" stroke="#E2E8F0"/>
  </g>

  <!-- Process Nodes & Flows -->
  <!-- Node 1: PRD (Lane 1, Col 1) -->
  <g transform="translate(260, 170)" filter="url(#sl-shadow)">
    <rect x="0" y="0" width="180" height="84" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" rx="6"/>
    <text x="14" y="24" fill="#0284C7" font-size="11" font-weight="700">01 需求定义</text>
    <text x="14" y="44" fill="#0F172A" font-size="13" font-weight="600">PRD 需求准入与评审</text>
    <text x="14" y="64" fill="#64748B" font-size="11">商业价值测算 &amp; 埋点设计</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M440 212 L500 212 L500 340 L520 340" fill="none" stroke="#0284C7" stroke-width="2" marker-end="url(#sl-arrow)"/>

  <!-- Node 2: Technical Design (Lane 2, Col 2) -->
  <g transform="translate(580, 340)" filter="url(#sl-shadow)">
    <rect x="0" y="0" width="190" height="84" fill="#FFFFFF" stroke="#334155" stroke-width="1.5" rx="6"/>
    <text x="14" y="24" fill="#6366F1" font-size="11" font-weight="700">02 架构实现</text>
    <text x="14" y="44" fill="#0F172A" font-size="13" font-weight="600">方案评审 &amp; 核心编码</text>
    <text x="14" y="64" fill="#64748B" font-size="11">代码双人审查 + 单元测试覆盖</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M770 382 L810 382 L810 510 L830 510" fill="none" stroke="#0284C7" stroke-width="2" marker-end="url(#sl-arrow)"/>

  <!-- Node 3: QA Automated Suite (Lane 3, Col 3) -->
  <g transform="translate(890, 510)" filter="url(#sl-shadow)">
    <rect x="0" y="0" width="190" height="84" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" rx="6"/>
    <text x="14" y="24" fill="#D97706" font-size="11" font-weight="700">03 质量与红蓝门禁</text>
    <text x="14" y="44" fill="#0F172A" font-size="13" font-weight="600">全量回归与渗透测试</text>
    <text x="14" y="64" fill="#64748B" font-size="11">P0 Bug 清零 &amp; 压测达标</text>
  </g>

  <!-- Node 3 -> Rejection Loop to Node 2 -->
  <path d="M985 510 L985 460 L675 460 L675 424" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#sl-reject)"/>
  <rect x="780" y="448" width="100" height="18" fill="#FEE2E2" rx="3"/>
  <text x="830" y="461" fill="#B91C1C" font-size="10" font-weight="600" text-anchor="middle">未达标打回修改</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M1080 552 L1120 552 L1120 680 L1140 680" fill="none" stroke="#0284C7" stroke-width="2" marker-end="url(#sl-arrow)"/>

  <!-- Node 4: SRE Canary Release (Lane 4, Col 4) -->
  <g transform="translate(1200, 680)" filter="url(#sl-shadow)">
    <rect x="0" y="0" width="180" height="84" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" rx="6"/>
    <text x="14" y="24" fill="#16A34A" font-size="11" font-weight="700">04 灰度与可观测</text>
    <text x="14" y="44" fill="#0F172A" font-size="13" font-weight="600">5% → 20% → 100% 灰度</text>
    <text x="14" y="64" fill="#64748B" font-size="11">异常秒级熔断回滚机制</text>
  </g>

  <!-- Loop back from Node 4 to Node 1 (Business metrics feedback) -->
  <path d="M1290 764 L1290 800 L350 800 L350 254" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#sl-arrow)"/>
  <rect x="740" y="790" width="180" height="20" fill="#F1F5F9" stroke="#CBD5E1" rx="4"/>
  <text x="830" y="804" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">线上业务数据指标复盘，反哺需求池</text>

  <!-- Footer -->
  <g id="slot-footer" transform="translate(60, 856)">
    <text x="0" y="14" fill="#94A3B8" font-size="11">研发流程规范：DevOps 成熟度标准 ｜ 阶段交付准出准入门禁约束 ｜ 审计追溯链完全留痕</text>
    <text x="1280" y="14" fill="#94A3B8" font-size="11" text-anchor="end">平均发布迭代周期：双周冲刺 (Sprint) ｜ 金丝雀自动回滚率 &lt; 0.3%</text>
  </g>
</svg>