<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" style="background:#FFFFFF;font-family:Inter,system-ui,sans-serif;">
  <defs>
    <filter id="c2r-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Masthead -->
  <g id="slot-header" transform="translate(60, 48)">
    <rect x="0" y="0" width="4" height="40" fill="#0F172A" rx="2"/>
    <text x="16" y="24" fill="#0F172A" font-size="24" font-weight="700">战略竞品综合对标套件 (Competitive 2×2 Matrix &amp; Radar Benchmark)</text>
    <text x="16" y="44" fill="#64748B" font-size="13">左侧：创新力与执行力战略定位四象限 ｜ 右侧：六维核心能力雷达对标（我方产品 vs. 竞品 A vs. 行业均值）</text>
  </g>

  <!-- LEFT PANEL: 2x2 Strategic Quadrant (Width 580) -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="580" height="680" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" rx="8" filter="url(#c2r-shadow)"/>
    <text x="24" y="36" fill="#0F172A" font-size="16" font-weight="700">战略定位 2×2 象限图 (Strategic Positioning)</text>
    <text x="24" y="56" fill="#64748B" font-size="12">横轴：市场商业化与落地执行力 ｜ 纵轴：前沿技术自研与创新愿景</text>

    <!-- Quadrant 4 Tiles -->
    <!-- Q2: Top Left (Challengers) -->
    <rect x="40" y="90" width="240" height="240" fill="#FEFCE8" fill-opacity="0.6"/>
    <text x="56" y="116" fill="#A16207" font-size="12" font-weight="700">愿景先锋者 (Visionaries)</text>
    <!-- Q1: Top Right (Leaders - Best) -->
    <rect x="290" y="90" width="240" height="240" fill="#F0FDF4" fill-opacity="0.7"/>
    <text x="306" y="116" fill="#15803D" font-size="12" font-weight="700">行业领军者 (Leaders) ★</text>
    <!-- Q3: Bottom Left (Niche) -->
    <rect x="40" y="340" width="240" height="240" fill="#F8FAFC" fill-opacity="0.8"/>
    <text x="56" y="366" fill="#64748B" font-size="12" font-weight="700">利基跟随者 (Niche Players)</text>
    <!-- Q4: Bottom Right (Established) -->
    <rect x="290" y="340" width="240" height="240" fill="#F0F9FF" fill-opacity="0.6"/>
    <text x="306" y="366" fill="#0369A1" font-size="12" font-weight="700">传统巨头 (Incumbents)</text>

    <!-- Axes Crosshair -->
    <line x1="285" y1="80" x2="285" y2="590" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="30" y1="335" x2="540" y2="335" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Arrows -->
    <polygon points="285,75 281,85 289,85" fill="#64748B"/>
    <polygon points="545,335 535,331 535,339" fill="#64748B"/>
    <text x="295" y="78" fill="#64748B" font-size="11" font-weight="600">技术创新愿景 →</text>
    <text x="440" y="325" fill="#64748B" font-size="11" font-weight="600">商业执行力 →</text>

    <!-- Bubble: Our Company (Top Right Leader) -->
    <g transform="translate(430, 180)">
      <circle cx="0" cy="0" r="32" fill="#0284C7" fill-opacity="0.25" stroke="#0284C7" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="8" fill="#0284C7"/>
      <text x="0" y="48" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">我方产品 (Our SaaS)</text>
      <text x="0" y="64" fill="#0284C7" font-size="10" font-weight="600" text-anchor="middle">Top 1 综合得分 9.2</text>
    </g>

    <!-- Bubble: Competitor A (Top Left) -->
    <g transform="translate(180, 210)">
      <circle cx="0" cy="0" r="24" fill="#E11D48" fill-opacity="0.15" stroke="#E11D48" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="6" fill="#E11D48"/>
      <text x="0" y="40" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">头部竞品 A</text>
      <text x="0" y="54" fill="#E11D48" font-size="10" text-anchor="middle">得分 8.1</text>
    </g>

    <!-- Bubble: Competitor B (Bottom Right) -->
    <g transform="translate(420, 440)">
      <circle cx="0" cy="0" r="26" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="6" fill="#F59E0B"/>
      <text x="0" y="42" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">传统软件巨头 B</text>
      <text x="0" y="56" fill="#D97706" font-size="10" text-anchor="middle">得分 7.6</text>
    </g>

    <!-- Bubble: Competitor C (Bottom Left) -->
    <g transform="translate(140, 480)">
      <circle cx="0" cy="0" r="18" fill="#64748B" fill-opacity="0.15" stroke="#64748B" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#64748B"/>
      <text x="0" y="34" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">初创企业 C</text>
      <text x="0" y="48" fill="#64748B" font-size="10" text-anchor="middle">得分 5.8</text>
    </g>
  </g>

  <!-- RIGHT PANEL: 6-Dimensional Radar Chart (Width 660) -->
  <g transform="translate(680, 130)">
    <rect x="0" y="0" width="660" height="680" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" rx="8" filter="url(#c2r-shadow)"/>
    <text x="24" y="36" fill="#0F172A" font-size="16" font-weight="700">六维核心能力深度雷达对标 (Capability Benchmark)</text>
    <text x="24" y="56" fill="#64748B" font-size="12">基于第三方工信安全测评与 500 家企业级用户真实调研评分</text>

    <!-- Radar Center cx=330, cy=350, max_r=200 -->
    <!-- 6 Axes at 0, 60, 120, 180, 240, 300 deg -->
    <!-- Background Rings -->
    <polygon points="330,150 503,250 503,450 330,550 157,450 157,250" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <polygon points="330,200 460,275 460,425 330,500 200,425 200,275" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <polygon points="330,250 417,300 417,400 330,450 243,400 243,300" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <polygon points="330,300 373,325 373,375 330,400 287,375 287,325" fill="none" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Axis Lines -->
    <line x1="330" y1="350" x2="330" y2="140" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="330" y1="350" x2="512" y2="245" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="330" y1="350" x2="512" y2="455" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="330" y1="350" x2="330" y2="560" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="330" y1="350" x2="148" y2="455" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="330" y1="350" x2="148" y2="245" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Axis Labels -->
    <text x="330" y="126" fill="#0F172A" font-size="12" font-weight="700" text-anchor="middle">① 核心性能与延迟 (P99 &lt; 8ms)</text>
    <text x="525" y="245" fill="#0F172A" font-size="12" font-weight="700" text-anchor="start">② 功能完备度</text>
    <text x="525" y="465" fill="#0F172A" font-size="12" font-weight="700" text-anchor="start">③ 开放生态与 API</text>
    <text x="330" y="580" fill="#0F172A" font-size="12" font-weight="700" text-anchor="middle">④ 实施部署周期 (7 天上线)</text>
    <text x="135" y="465" fill="#0F172A" font-size="12" font-weight="700" text-anchor="end">⑤ 企业级安全合规</text>
    <text x="135" y="245" fill="#0F172A" font-size="12" font-weight="700" text-anchor="end">⑥ 综合投入产出比 (ROI)</text>

    <!-- Radar Series 1: Industry Average (Grey Dashed) -->
    <polygon points="330,230 434,290 417,400 330,470 226,410 243,300" fill="#64748B" fill-opacity="0.08" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Radar Series 2: Competitor A (Red Line) -->
    <polygon points="330,190 478,265 434,410 330,450 209,420 226,290" fill="#E11D48" fill-opacity="0.12" stroke="#E11D48" stroke-width="2"/>

    <!-- Radar Series 3: Our Company (Blue Solid, Highlighted) -->
    <polygon points="330,154 495,255 486,440 330,530 166,445 174,260" fill="#0284C7" fill-opacity="0.25" stroke="#0284C7" stroke-width="2.8"/>
    <!-- Dots for Our Company -->
    <circle cx="330" cy="154" r="4.5" fill="#0284C7"/>
    <circle cx="495" cy="255" r="4.5" fill="#0284C7"/>
    <circle cx="486" cy="440" r="4.5" fill="#0284C7"/>
    <circle cx="330" cy="530" r="4.5" fill="#0284C7"/>
    <circle cx="166" cy="445" r="4.5" fill="#0284C7"/>
    <circle cx="174" cy="260" r="4.5" fill="#0284C7"/>

    <!-- Legend -->
    <g transform="translate(180, 620)">
      <line x1="0" y1="12" x2="30" y2="12" stroke="#0284C7" stroke-width="3"/>
      <circle cx="15" cy="12" r="4" fill="#0284C7"/>
      <text x="38" y="16" fill="#0F172A" font-size="12" font-weight="700">我方产品 (领先 5 项)</text>

      <line x1="180" y1="12" x2="210" y2="12" stroke="#E11D48" stroke-width="2"/>
      <text x="218" y="16" fill="#334155" font-size="12">竞品 A (仅功能项持平)</text>

      <line x1="360" y1="12" x2="390" y2="12" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="398" y="16" fill="#64748B" font-size="12">行业基准均值</text>
    </g>
  </g>

  <!-- Footer -->
  <g id="slot-footer" transform="translate(60, 856)">
    <text x="0" y="14" fill="#94A3B8" font-size="11">分析基准：Gartner Magic Quadrant 评估维度 ｜ 评测样本：2026 年度 12 家主流厂商实测数据</text>
    <text x="1280" y="14" fill="#94A3B8" font-size="11" text-anchor="end">我方优势项：P99 延迟快 3.2x ｜ 部署周期缩短 65% ｜ 总体 TCO 节约 42%</text>
  </g>
</svg>