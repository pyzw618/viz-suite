<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>区域分组柱 · ECharts</title>
<style>
:root{--viz-bg:#FFFFFF;--viz-text:#1F2937;--viz-muted:#6B7280;--viz-grid:#E2E8F0;--viz-focal:#0072B2;--viz-context:#CBD5E1;--viz-positive:#198038;--viz-negative:#DA1E28;--viz-alert:#D97706}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--viz-bg);color:var(--viz-text);font-family:"Inter","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif}
body{padding:20px 24px 12px;overflow-x:hidden}header h1{font-size:20px;margin:0 0 4px;font-weight:700}header p{margin:0 0 12px;color:var(--viz-muted);font-size:13px}
#chart{width:100%;height:calc(100vh - 150px);min-height:420px}figcaption{font-size:12px;color:var(--viz-muted);margin-top:8px}
@media (max-width:600px){body{padding:12px}header h1{font-size:17px}header p{font-size:12px}#chart{height:calc(100vh - 130px)}}
@media (prefers-color-scheme: dark){:root{--viz-bg:#0B1220;--viz-text:#E5E7EB;--viz-muted:#9CA3AF;--viz-grid:#334155}}
</style>
</head>
<body>
<header><h1>华东与华南 2025 年收入领先，西北增速最高</h1><p>单位：百万元｜2024 与 2025 分组对比｜演示用合成数据</p></header>
<figure>
  <div id="chart" role="img" aria-label="五大区域 2024 与 2025 年收入分组柱图，华东最高"></div>
  <figcaption>数据来源：演示数据（合成）｜ECharts 5｜离线自包含</figcaption>
</figure>
<script src="../../assets/vendor/echarts.min.js"></script>
<script>
const css = getComputedStyle(document.documentElement);
const C = k => css.getPropertyValue(k).trim();
const ROLE = {text:C('--viz-text'),muted:C('--viz-muted'),grid:C('--viz-grid'),focal:C('--viz-focal'),context:C('--viz-context'),positive:C('--viz-positive'),negative:C('--viz-negative'),alert:C('--viz-alert')};
const COLORS = [ROLE.context, ROLE.focal];
const regions = ['华东', '华南', '华北', '西南', '西北'];
const y2024 = [86, 72, 64, 48, 26];
const y2025 = [98, 84, 69, 57, 34];
const chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
function buildOption(width) {
  const mobile = width < 600;
  return {
    backgroundColor: 'transparent',
    aria: {enabled: true, decal: {show: false}, label: {description: '华东和华南收入最高，西北 2025 年同比增长 31%。'}},
    color: COLORS,
    tooltip: {trigger: 'axis', axisPointer: {type: 'shadow'}},
    legend: {top: 0, right: 0, data: ['2024', '2025'], textStyle: {color: ROLE.text, fontSize: mobile ? 11 : 12}},
    grid: {left: mobile ? 42 : 56, right: mobile ? 16 : 28, top: mobile ? 56 : 44, bottom: mobile ? 32 : 38},
    xAxis: {type: 'category', data: regions, axisTick: {show: false}, axisLine: {lineStyle: {color: ROLE.grid}},
      axisLabel: {color: ROLE.muted, fontSize: mobile ? 11 : 12}},
    yAxis: {type: 'value', name: mobile ? '' : '收入（百万元）', nameTextStyle: {color: ROLE.muted},
      splitLine: {lineStyle: {color: ROLE.grid, type: 'dashed', opacity: 0.55}}, axisLabel: {color: ROLE.muted, fontSize: mobile ? 10 : 12}},
    series: [
      {name: '2024', type: 'bar', data: y2024, barWidth: mobile ? 12 : 20, itemStyle: {color: ROLE.context, borderColor: ROLE.context, borderWidth: 1}},
      {name: '2025', type: 'bar', data: y2025, barWidth: mobile ? 12 : 20, itemStyle: {color: 'rgba(0,114,178,0.22)', borderColor: ROLE.focal, borderWidth: 1.2},
       label: {show: !mobile, position: 'top', color: ROLE.muted, fontSize: 11}}
    ]
  };
}
function render() { const w = window.innerWidth; chart.resize(); chart.setOption(buildOption(w), true); }
render();
let timer = null; window.addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(render, 120); });
</script>
</body>
</html>
