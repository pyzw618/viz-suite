<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桑基流量 · ECharts</title>
<style>
:root{--viz-bg:#FFFFFF;--viz-text:#1F2937;--viz-muted:#6B7280;--viz-grid:#E2E8F0;--viz-focal:#0072B2;--viz-context:#CBD5E1;--viz-positive:#198038;--viz-negative:#DA1E28;--viz-alert:#D97706}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--viz-bg);color:var(--viz-text);font-family:"Inter","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif}
body{padding:20px 24px 12px;overflow-x:hidden}header h1{font-size:20px;margin:0 0 4px;font-weight:700}header p{margin:0 0 12px;color:var(--viz-muted);font-size:13px}
#chart{width:100%;height:calc(100vh - 150px);min-height:420px}figcaption{font-size:12px;color:var(--viz-muted);margin-top:8px}
@media (max-width:600px){body{padding:12px}header h1{font-size:17px}header p{font-size:12px}#chart{height:calc(100vh - 130px)}}
@media (prefers-color-scheme: dark){:root{--viz-bg:#0B1220;--viz-text:#E5E7EB;--viz-muted:#9CA3AF;--viz-grid:#334155}}
</style>
</head>
<body>
<header><h1>自然流量与付费投放贡献主要成交，社交平台流量主要经直播承接</h1><p>带宽为流量规模｜颜色区分来源阶段｜演示用合成数据</p></header>
<figure>
  <div id="chart" role="img" aria-label="从流量来源到承接渠道再到转化结果的桑基图，成交 950、流失 320"></div>
  <figcaption>数据来源：演示数据（合成）｜ECharts 5｜离线自包含</figcaption>
</figure>
<script src="../../assets/vendor/echarts.min.js"></script>
<script>
const css = getComputedStyle(document.documentElement);
const C = k => css.getPropertyValue(k).trim();
const ROLE = {text:C('--viz-text'),muted:C('--viz-muted'),grid:C('--viz-grid'),focal:C('--viz-focal'),context:C('--viz-context'),positive:C('--viz-positive'),negative:C('--viz-negative'),alert:C('--viz-alert')};
const nodes = [
  {name: '自然流量', itemStyle: {color: ROLE.focal}},
  {name: '付费投放', itemStyle: {color: '#E69F00'}},
  {name: '社交平台', itemStyle: {color: '#CC79A7'}},
  {name: '落地页', itemStyle: {color: '#3B7C70'}},
  {name: '直播', itemStyle: {color: '#5C8AA8'}},
  {name: '私域', itemStyle: {color: '#8C8C8C'}},
  {name: '成交', itemStyle: {color: ROLE.positive}},
  {name: '流失', itemStyle: {color: ROLE.negative}}
];
const links = [
  {source: '自然流量', target: '落地页', value: 320}, {source: '自然流量', target: '直播', value: 120},
  {source: '自然流量', target: '私域', value: 60}, {source: '付费投放', target: '落地页', value: 260},
  {source: '付费投放', target: '直播', value: 180}, {source: '社交平台', target: '直播', value: 220},
  {source: '社交平台', target: '私域', value: 110}, {source: '落地页', target: '成交', value: 430},
  {source: '落地页', target: '流失', value: 150}, {source: '直播', target: '成交', value: 380},
  {source: '直播', target: '流失', value: 140}, {source: '私域', target: '成交', value: 140},
  {source: '私域', target: '流失', value: 30}
];
const chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
function buildOption(width) {
  const mobile = width < 600;
  return {
    backgroundColor: 'transparent',
    aria: {enabled: true, decal: {show: false}, label: {description: '流量从三类来源经三类渠道，成交 950、流失 320。'}},
    tooltip: {trigger: 'item', triggerOn: 'mousemove', formatter: p => p.dataType === 'edge' ? `${p.data.source} → ${p.data.target}<br/>${p.data.value}` : p.name},
    series: [{
      type: 'sankey', left: mobile ? 4 : 16, right: mobile ? 4 : 16, top: mobile ? 28 : 22, bottom: mobile ? 18 : 22,
      nodeWidth: mobile ? 10 : 14, nodeGap: mobile ? 8 : 12,
      layoutIterations: 32, draggable: false,
      emphasis: {focus: 'adjacency'},
      label: {color: ROLE.text, fontSize: mobile ? 10 : 12, position: mobile ? 'right' : 'right'},
      lineStyle: {color: 'gradient', curveness: 0.5, opacity: 0.36},
      itemStyle: {borderWidth: 0},
      data: nodes, links
    }]
  };
}
function render() { const w = window.innerWidth; chart.resize(); chart.setOption(buildOption(w), true); }
render();
let timer = null; window.addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(render, 120); });
</script>
</body>
</html>
